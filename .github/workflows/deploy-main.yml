name: Deploy live from main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag eller branch som skal deployes. Bruk en tidligere grønn commit for rollback.
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: flyvendebonder-live
  cancel-in-progress: true

jobs:
  deploy-webroot:
    name: Deploy live on Mac mini
    runs-on:
      - self-hosted
      - macOS
      - flyvendebonder-live
    timeout-minutes: 20
    env:
      DEST: /Users/henrymeen/srv/www/flyvendebonder/
      PYTHON39_BIN: /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Create isolated production-compatible Python environment
        run: |
          "$PYTHON39_BIN" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          rm -rf "$RUNNER_TEMP/flyvendebonder-python39"
          "$PYTHON39_BIN" -m venv "$RUNNER_TEMP/flyvendebonder-python39"
          "$RUNNER_TEMP/flyvendebonder-python39/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/flyvendebonder-python39/bin/python" -m pip install -r apps/backend-api/requirements.txt

      - name: Gate deployment on production Python
        working-directory: apps/backend-api
        run: |
          "$RUNNER_TEMP/flyvendebonder-python39/bin/python" -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Keep this inline so rollback can check out commits from before
          # .nvmrc was introduced.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web-app
        run: npm ci

      - name: Deploy backend locally
        run: ./scripts/deploy-backend-macmini.sh

      - name: Deploy live webroot locally
        run: ./scripts/deploy-flyvendebonder.sh --local --dest "$DEST"

      - name: Record deployed commit
        run: |
          DEPLOYED_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$DEPLOYED_SHA" "$DEPLOYED_AT" > "$DEST/deployment.json"

      - name: Verify live health and app
        env:
          LIVE_BASE_URL: https://xn--flyvendebnder-jnb.no
          EXPECT_OPEN_ACCESS: "true"
        run: |
          HEALTH_PAYLOAD="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$LIVE_BASE_URL/api/v1/health")"
          python3 -c 'import json, sys; payload=json.loads(sys.argv[1]); assert payload.get("status") == "ok", payload' "$HEALTH_PAYLOAD"
          SESSION_PAYLOAD="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$LIVE_BASE_URL/api/v1/admin/session")"
          python3 -c 'import json, os, sys; payload=json.loads(sys.argv[1]); expected=os.environ["EXPECT_OPEN_ACCESS"] == "true"; assert payload.get("configured") is True and payload.get("open_access") is expected and payload.get("authenticated") is expected and payload.get("expires_at") is None, payload' "$SESSION_PAYLOAD"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$LIVE_BASE_URL/api/v1/profile/current" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$LIVE_BASE_URL/app/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$LIVE_BASE_URL/deployment.json" >/dev/null
