<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flyvendebønder demo | Tidskart</title>
    <meta
      name="description"
      content="Kartdemo med tidslinje som viser dronebilder på GPS-posisjon dag for dag."
    />
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./vendor/markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="./vendor/markercluster/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="map-page">
    <a class="skip-link" href="#timeline">Hopp til tidslinje</a>

    <div id="map" class="map" aria-label="Kart med geotaggede bilder"></div>

    <header class="floating topbar" role="banner">
      <a class="topbar__back" href="/">Til infosiden</a>
      <h1 class="topbar__title">Flyvendebønder tidskart</h1>
      <p class="topbar__subtitle">Bla dag for dag i geotaggede dronebilder fra Meen gård.</p>
      <p id="status" class="topbar__status">Laster data ...</p>
      <p id="property-label" class="topbar__property">Eiendom: 3807-70/17/0 (Roar Meen)</p>
      <div class="topbar__property-controls">
        <label class="property-toggle" for="toggle-property">
          <input id="toggle-property" type="checkbox" checked />
          Vis eiendomsgrenser
        </label>
        <button id="refresh-jobid" type="button" class="btn btn--small">Forny jobId</button>
      </div>
      <p id="property-status" class="topbar__property-status">Eiendomslag: laster ...</p>
    </header>

    <aside id="photo-panel" class="floating photo-panel" aria-live="polite">
      <h2 class="photo-panel__title">Velg et punkt</h2>
      <p class="photo-panel__meta">Klikk markør eller bilde i stripen nederst.</p>
      <img
        class="photo-panel__image"
        src="./assets/photos/meen-20240701184522_0021_d.jpg"
        alt="Forhåndsvisning"
      />
      <p class="photo-panel__caption">Detaljer om valgt bilde vises her.</p>
    </aside>

    <section id="timeline" class="floating timeline" aria-label="Tidslinje">
      <div class="timeline__controls">
        <button id="prev-day" type="button" class="btn">Forrige</button>
        <button id="play-pause" type="button" class="btn">Spill av</button>
        <button id="next-day" type="button" class="btn">Neste</button>

        <label class="mode-toggle" for="mode-cumulative">
          <input id="mode-cumulative" type="checkbox" checked />
          Vis alt t.o.m. valgt dag
        </label>
      </div>

      <input id="time-slider" class="timeline__slider" type="range" min="0" max="0" step="1" value="0" />

      <div class="timeline__dates">
        <span id="date-min">-</span>
        <strong id="date-current">-</strong>
        <span id="date-max">-</span>
      </div>

      <ul id="photo-strip" class="photo-strip" aria-label="Bilder for valgt tidsvisning"></ul>
    </section>

    <script src="./vendor/leaflet/leaflet.js"></script>
    <script src="./vendor/markercluster/leaflet.markercluster.js"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
