[project]
name = "flyvendebonder-backend"
version = "0.1.0"
description = "Backend API for Flyvendebønder"
requires-python = ">=3.9"

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.37",
  "alembic==1.14.1",
  "shapely==2.0.7",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "Pillow==11.1.0",
  "python-multipart==0.0.20",
  "eval_type_backport==0.2.2",
]

[tool.alembic]
script_location = "alembic"

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]
